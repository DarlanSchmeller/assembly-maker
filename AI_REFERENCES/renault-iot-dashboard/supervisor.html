<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torre de Controle | Supervisor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100">
    <nav class="bg-gray-900 text-white p-4 flex justify-between items-center shadow-md">
        <div class="font-bold text-xl">Torre de Controle - Sala de Montagem</div>
        <div id="mqtt-status" class="text-sm bg-red-500 px-3 py-1 rounded-full">MQTT Offline</div>
    </nav>

    <main class="max-w-7xl mx-auto mt-8 p-4">
        <!-- KPIs -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow border-t-4 border-blue-500">
                <h3 class="text-gray-500 text-sm font-bold uppercase">Peças Produzidas</h3>
                <p id="kpi-pecas" class="text-4xl font-black text-gray-800 mt-2">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border-t-4 border-green-500">
                <h3 class="text-gray-500 text-sm font-bold uppercase">Lead Time Médio</h3>
                <p id="kpi-tempo" class="text-4xl font-black text-gray-800 mt-2">0s</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border-t-4 border-yellow-500">
                <h3 class="text-gray-500 text-sm font-bold uppercase">Status Estoque (Bancada 1)</h3>
                <p id="kpi-estoque" class="text-4xl font-black text-gray-800 mt-2">Aguardando...</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border-t-4 border-purple-500">
                <h3 class="text-gray-500 text-sm font-bold uppercase">Operador Ativo</h3>
                <p class="text-2xl font-black text-gray-800 mt-2">Matheus T.</p>
            </div>
        </div>

        <!-- Gráfico e Log -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-xl shadow">
                <h3 class="font-bold text-gray-700 mb-4">Tempo de Ciclo por Caixa (Segundos)</h3>
                <canvas id="cycleChart" height="150"></canvas>
            </div>
            <div class="bg-white p-6 rounded-xl shadow">
                <h3 class="font-bold text-gray-700 mb-4">Feed de Eventos em Tempo Real (MQTT)</h3>
                <div id="event-log"
                    class="bg-gray-900 text-green-400 font-mono text-sm p-4 rounded h-64 overflow-y-auto">
                    <!-- Logs entram aqui via JS -->
                </div>
            </div>
        </div>
    </main>

    <script src="js/mqtt-client.js"></script>
    <script src="js/supervisor.js"></script>
</body>

</html>
